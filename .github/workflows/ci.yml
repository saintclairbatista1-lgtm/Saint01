name: S Message CI - Crypto & Certificate Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-security:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências (Cryptography)
      run: |
        python -m pip install --upgrade pip
        pip install cryptography

    - name: Executar gerador de certificado digital
      run: |
        python gera_certificado.py

    - name: Executar teste do microprocessador e AES-GCM
      run: |
        python teste_crypto.py
